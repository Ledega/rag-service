[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "Minimal learning-friendly RAG app with FastAPI and a single-page frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=1.5.9",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "langchain>=1.3.6",
  "langchain-community>=0.4.2",
  "langchain-openai>=1.3.0",
  "langchain-text-splitters>=0.3.0",
  "pypdf>=5.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app"]