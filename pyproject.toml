[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-service"
version = "0.1.0"
description = "Minimal learning-friendly RAG app with FastAPI and a single-page frontend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "pymupdf>=1.27.2.3",
  "python-multipart>=0.0.9",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools]
packages = ["app"]
